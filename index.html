<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crop Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Abstract Background -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="dashboard-container">
        <!-- Header -->
        <header>
            <div class="title-wrapper">
                <span class="material-symbols-rounded head-icon">compost</span>
                <h1>Smart Crop <span class="highlight">System</span></h1>
            </div>
            <p class="subtitle">Real-time IoT + AI based monitoring</p>
        </header>

        <!-- Metrics Grid -->
        <main class="metrics-grid">

            <!-- Temperature -->
            <div class="card glass">
                <div class="card-header">
                    <div class="icon-box temp-bg">
                        <span class="material-symbols-rounded temp-icon">device_thermostat</span>
                    </div>
                    <h2>Temperature</h2>
                </div>
                <div class="card-body">
                    <span id="temp" class="value">--</span>
                    <span class="unit">°C</span>
                </div>
            </div>

            <!-- Humidity -->
            <div class="card glass">
                <div class="card-header">
                    <div class="icon-box hum-bg">
                        <span class="material-symbols-rounded hum-icon">humidity_mid</span>
                    </div>
                    <h2>Humidity</h2>
                </div>
                <div class="card-body">
                    <span id="hum" class="value">--</span>
                    <span class="unit">%</span>
                </div>
            </div>

            <!-- Soil Moisture -->
            <div class="card glass">
                <div class="card-header">
                    <div class="icon-box soil-bg">
                        <span class="material-symbols-rounded soil-icon">grass</span>
                    </div>
                    <h2>Soil Moisture</h2>
                </div>
                <div class="card-body">
                    <span id="soil" class="value">--</span>
                    <span class="unit">%</span>
                </div>
            </div>

            <!-- Rain -->
            <div class="card glass">
                <div class="card-header">
                    <div class="icon-box rain-bg">
                        <span class="material-symbols-rounded rain-icon">water_drop</span>
                    </div>
                    <h2>Rainfall</h2>
                </div>
                <div class="card-body">
                    <span id="rain" class="value">--</span>
                </div>
            </div>

        </main>

        <!-- Recommendation Section -->
        <section class="recommendation-section glass">
            <div class="rec-header">
                <span class="material-symbols-rounded star-icon">auto_awesome</span>
                <h2>Recommended Crop</h2>
            </div>
            <div class="crop-display">
                <span id="crop" class="crop-value">Loading...</span>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>

</html>
